# Sources for the Publications page (publications/index.md) and the research pages.
#
# The cite process (_cite/cite.py) runs Manubot on every entry with an "id" and writes
# _data/citations.yaml. Fields set here override Manubot's.
#   group: caltech | prior        section of the Publications page (patents use type: patent)
#   tags:  nanotechnology | genetic-engineering | rhizosphere
#          "Related publications" on the matching research page
#   authors: on Manubot (id) entries, only set where the old site marked authors, to
#          keep the markers. The list is Manubot's, with \* (equal contribution, escaped
#          because author names are rendered as Markdown) or ‡ (co-corresponding author)
#          appended. Re-check these lists if a paper's metadata changes.
#   publisher: bioRxiv is set by hand on the preprints, because their DOI metadata names
#          openRxiv or a bioRxiv subject area (for example Bioengineering) instead.
# Entries without an id are manual citations (title, authors, publisher, date, link).

